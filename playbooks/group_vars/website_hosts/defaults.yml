---

webhost_certbot: False
default_initial_site_title: "Test Site"
wp_defaults:
  cli_image: "wordpress:cli"
  dissallow_file_mods: true
  auto_update_core: false
  force_ssl_admin: true
  themes: ["twentytwentyfive"]
  plugins: 
    - {"id":"limit-login-attempts-reloaded","active":true}
  remove_unspecified_themes: False
  remove_unspecified_plugins: False
om_defaults:
  cli_image:  "omeka-s-cli:latest"
  themes: ["default"]
  modules: 
    - {"id":"Lockout","active":true}
  base_docker_image: php:8.5-apache
  cli_url: "https://github.com/GhentCDH/Omeka-S-Cli/releases/download/v0.14.1/omeka-s-cli.phar"
  omeka_s_version: "4.2.1"
  remove_unspecified_themes: False
  remove_unspecified_modules: False
